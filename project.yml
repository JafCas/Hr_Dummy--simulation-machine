name: LocationSimulator
options:
  bundleIdPrefix: com.jafcas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
packages:
  LocationSimCore:
    path: Packages/LocationSimCore
targets:
  LocationSimulator:
    type: application
    platform: iOS
    sources:
      - path: App
    fileGroups:
      - GPX
    dependencies:
      - package: LocationSimCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Location Simulator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Shows your real position on the map so you can compare it with the simulated one.
        GooglePlacesAPIKey: $(GOOGLE_PLACES_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jafcas.LocationSimulator
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
  LocationSimulatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LocationSimulatorTests
    dependencies:
      - target: LocationSimulator
      - package: LocationSimCore
  LocationSimulatorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/LocationSimulatorUITests
    dependencies:
      - target: LocationSimulator
schemes:
  LocationSimulator:
    build:
      targets:
        LocationSimulator: all
    run:
      config: Debug
      simulateLocation:
        allow: true
        defaultLocation: GPX/CurrentLocation.gpx
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - LocationSimulator
      targets:
        - LocationSimulatorTests
        - LocationSimulatorUITests
